    /* ── Используем CSS-переменные Telegram напрямую ── */
    :root {
      --bg:       var(--tg-theme-bg-color, #ffffff);
      --bg2:      var(--tg-theme-secondary-bg-color, #f4f4f5);
      --text:     var(--tg-theme-text-color, #000000);
      --hint:     var(--tg-theme-hint-color, #999999);
      --link:     var(--tg-theme-link-color, #2481cc);
      --btn:      var(--tg-theme-button-color, #2481cc);
      --btn-text: var(--tg-theme-button-text-color, #ffffff);
      --sep:      var(--tg-theme-section-separator-color, rgba(0,0,0,0.1));
      --card:     var(--tg-theme-section-bg-color, #ffffff);
      --app-height: 100%;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    html, body {
      height: var(--app-height);
      background: var(--bg2);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", sans-serif;
      overflow: hidden;
    }

    /* ── Два экрана ── */
    .view {
      position: fixed; inset: 0;
      background: var(--bg2);
      overflow-y: auto; overflow-x: hidden;
      -webkit-overflow-scrolling: touch;
      overscroll-behavior-y: contain;
      transition: opacity .2s ease, transform .2s ease;
    }
    .view.hidden { opacity: 0; pointer-events: none; transform: translateX(16px); }

    /* ── Шапка ── */
    .header {
      position: sticky; top: 0; z-index: 10;
      background: var(--bg);
      border-bottom: 0.5px solid var(--sep);
      padding: 12px 16px;
      display: flex; align-items: center; justify-content: space-between;
    }
    .header-title { font-size: 17px; font-weight: 600; line-height: 1.2; }
    .header-sub   { font-size: 13px; color: var(--hint); margin-top: 1px; }
    .cart-open-btn {
      background: var(--btn); color: var(--btn-text);
      border: none; border-radius: 18px;
      padding: 7px 14px; font-size: 14px; font-weight: 600;
      cursor: pointer; font-family: inherit;
      display: flex; align-items: center; gap: 5px;
    }

    /* ── Чипы категорий ── */
    .chips {
      background: var(--bg);
      padding: 10px 16px;
      display: flex; gap: 8px;
      overflow-x: auto; -webkit-overflow-scrolling: touch;
      scrollbar-width: none; border-bottom: 0.5px solid var(--sep);
    }
    .chips::-webkit-scrollbar { display: none; }
    .chip {
      flex-shrink: 0; padding: 6px 14px; border-radius: 18px;
      font-size: 14px; font-family: inherit;
      background: var(--bg2); color: var(--text);
      border: none; cursor: pointer; transition: background .15s, color .15s;
      white-space: nowrap;
    }
    .chip.active { background: var(--btn); color: var(--btn-text); }

    /* ── Секция товаров ── */
    .section-label {
      padding: 20px 16px 6px;
      font-size: 13px; color: var(--hint);
      font-weight: 500; text-transform: uppercase; letter-spacing: 0.4px;
    }
    .section-cards {
      background: var(--card);
      border-top: 0.5px solid var(--sep);
      border-bottom: 0.5px solid var(--sep);
    }
    .product-row {
      padding: 12px 16px;
      border-bottom: 0.5px solid var(--sep);
    }
    .product-row:last-child { border-bottom: none; }
    .product-name { font-size: 15px; font-weight: 500; line-height: 1.3; }
    .product-note { font-size: 12px; color: var(--hint); margin-top: 3px; line-height: 1.4; }
    .price-pills  { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }

    .price-pill {
      display: flex; align-items: center; gap: 4px;
      background: var(--bg2); border: none; border-radius: 14px;
      padding: 5px 10px; cursor: pointer; font-family: inherit;
      transition: opacity .1s, background .15s;
    }
    .price-pill:active { opacity: 0.55; }
    .price-pill.added  { background: var(--btn); }
    .ppl { font-size: 12px; color: var(--hint); }
    .ppv { font-size: 13px; font-weight: 700; color: var(--text); }
    .ppp { font-size: 14px; color: var(--link); font-weight: 700; }
    .price-pill.added .ppl,
    .price-pill.added .ppv,
    .price-pill.added .ppp { color: var(--btn-text); }
    .ppp-qty {
      background: rgba(255,255,255,0.25);
      border-radius: 8px;
      padding: 0 5px;
      min-width: 20px;
      text-align: center;
      font-size: 12px;
      font-weight: 700;
    }
    .product-row.in-cart {
      border-left: 3px solid var(--btn);
      padding-left: 13px;
    }

    /* ── Корзина — форма ── */
    .form-block {
      background: var(--card);
      border-top: 0.5px solid var(--sep);
      border-bottom: 0.5px solid var(--sep);
    }
    .form-row {
      display: flex; align-items: center; min-height: 44px;
      padding: 0 16px; border-bottom: 0.5px solid var(--sep);
    }
    .form-row:last-child { border-bottom: none; }
    .form-lbl { font-size: 15px; width: 90px; flex-shrink: 0; color: var(--text); }
    .form-inp {
      flex: 1; border: none; outline: none; background: transparent;
      font-size: 15px; color: var(--text); padding: 12px 0; font-family: inherit;
    }
    .form-inp::placeholder { color: var(--hint); }

    /* ── Товары в корзине ── */
    .cart-items {
      background: var(--card);
      border-top: 0.5px solid var(--sep);
      border-bottom: 0.5px solid var(--sep);
    }
    .cart-item {
      padding: 12px 16px;
      border-bottom: 0.5px solid var(--sep);
    }
    .cart-item:last-child { border-bottom: none; }
    .ci-top {
      display: flex; justify-content: space-between; align-items: flex-start;
      margin-bottom: 10px; gap: 12px;
    }
    .ci-name   { font-size: 15px; font-weight: 500; }
    .ci-weight { font-size: 13px; color: var(--hint); margin-top: 2px; }
    .ci-price  { font-size: 16px; font-weight: 700; white-space: nowrap; }
    .ci-sub    { font-size: 12px; color: var(--hint); text-align: right; }
    .ci-bottom { display: flex; align-items: center; justify-content: space-between; }

    .qty { display: flex; align-items: center; gap: 4px; }
    .qty-btn {
      width: 32px; height: 32px; border-radius: 50%;
      background: var(--bg2); border: none; cursor: pointer;
      font-size: 20px; font-weight: 300; color: var(--btn);
      display: flex; align-items: center; justify-content: center;
      font-family: inherit; line-height: 1;
    }
    .qty-btn:active { opacity: 0.6; }
    .qty-num { min-width: 36px; text-align: center; font-size: 16px; font-weight: 600; }
    .del-btn {
      border: none; background: none; color: var(--link);
      font-size: 14px; cursor: pointer; font-family: inherit; padding: 4px 0;
    }

    /* ── Прочее ── */
    .footer-info {
      padding: 14px 16px; font-size: 13px; color: var(--hint);
      text-align: center; line-height: 1.5;
    }
    .empty {
      display: flex; flex-direction: column; align-items: center;
      justify-content: center; padding: 80px 32px; text-align: center; gap: 10px;
    }
    .empty-icon  { font-size: 52px; }
    .empty-title { font-size: 20px; font-weight: 600; }
    .empty-sub   { font-size: 15px; color: var(--hint); }
    .spacer      { height: 130px; }

    /* Кнопки для браузера (без Telegram) */
    .browser-btns { padding: 16px; display: flex; flex-direction: column; gap: 10px; }
    .b-btn {
      border: none; border-radius: 12px; padding: 14px;
      font-size: 16px; font-weight: 600; cursor: pointer; font-family: inherit;

    }

    .b-btn-primary { background: var(--btn); color: var(--btn-text); }
    .b-btn-secondary { background: var(--bg2); color: var(--text); }
  </style>
</head>

    (function(){
      const tg = window.Telegram?.WebApp || null;
      let baseH = 0, raf = 0;
      function measure(){
        const vv = window.visualViewport;
        const vH = vv ? Math.round(vv.height) : Math.round(window.innerHeight||0);
        const vT = vv ? Math.round(vv.offsetTop||0) : 0;
        const c = Math.max(
          tg?.viewportStableHeight ? Math.round(tg.viewportStableHeight) : 0,
          tg?.viewportHeight ? Math.round(tg.viewportHeight) : 0,
          Math.round(window.innerHeight||0), vH + vT
        );
        if(c > baseH) baseH = c;
        document.documentElement.style.setProperty('--app-height', baseH+'px');
      }
      function compute(){
        if(raf) cancelAnimationFrame(raf);
        raf = requestAnimationFrame(()=>{ measure(); setTimeout(measure,50); setTimeout(measure,150); });
      }
      if(tg?.expand) tg.expand();
      compute();
      tg?.onEvent?.('viewportChanged', compute);
      window.addEventListener('resize', compute);
      window.addEventListener('orientationchange', compute);
      window.visualViewport?.addEventListener('resize', compute);
    })();
  </script>

          tg.BackButton?.hide();
          tg.SecondaryButton?.hide();
          if(totalQty > 0) {
            tg.MainButton?.setText(` Корзина · ${totalQty} поз. · ${fmt(totalPrice)}`);
            tg.MainButton?.show();
          } else {
            tg.MainButton?.hide();
          }
        } else {
          tg.BackButton?.show();
          if(totalQty > 0) {
            tg.MainButton?.setText(` Отправить заказ · ${fmt(totalPrice)}`);
            tg.MainButton?.show();
            tg.SecondaryButton?.setText("🗑️  Очистить корзину");
            tg.SecondaryButton?.show();
          } else {
            tg.MainButton?.hide();
            tg.SecondaryButton?.hide();
          }
        }
      }, [view, totalQty, totalPrice]);

      // ── Обработчики нативных кнопок ──
      useEffect(() => {
        if(!tg) return;

        const onMain = () => {
          if(view === "catalog") { haptic.light(); setView("cart"); }
          else sendOrder();
        };
        const onSecondary = () => {
          tg.showConfirm("Очистить корзину?", ok => {
            if(ok) { haptic.medium(); setCart([]); }
          });
        };
        const onBack = () => { haptic.light(); setView("catalog"); };

        tg.MainButton?.onClick(onMain);
        tg.SecondaryButton?.onClick(onSecondary);
        tg.BackButton?.onClick(onBack);
        return () => {
          tg.MainButton?.offClick(onMain);
          tg.SecondaryButton?.offClick(onSecondary);
          tg.BackButton?.offClick(onBack);
        };
      }, [view, cart, name, phone, address, totalPrice, sendOrder]);

      // ── Защита от закрытия ──
      useEffect(() => {
        if(!tg) return;
        cart.length > 0
          ? tg.enableClosingConfirmation?.()
          : tg.disableClosingConfirmation?.();
      }, [cart.length]);

      const filtered = useMemo(() =>
        data.filter(b => cat==="Все" || b.cat===cat), [cat]);

      const addToCart = useCallback((item, wt, ps) => {
        const pv = parsePrice(ps);
        if(pv<=0) return;
        const id = `${item.name}-${wt}`;
        setCart(prev => {
          const ex = prev.find(i=>i.id===id);
          if(ex) return prev.map(i=>i.id===id?{...i,quantity:i.quantity+1}:i);
          return [...prev, {id,name:item.name,weightType:wt,priceStr:ps,priceValue:pv,quantity:1}];
        });
      }, []);

      const updateQty = useCallback((id, qty) => {
        haptic.light();
        setCart(prev => qty<1 ? prev.filter(i=>i.id!==id) : prev.map(i=>i.id===id?{...i,quantity:qty}:i));
      }, []);

      const removeItem = useCallback((id) => {
        if(tg) {
          tg.showConfirm("Удалить товар?", ok => {
            if(ok) { haptic.medium(); setCart(prev=>prev.filter(i=>i.id!==id)); }
          });
        } else {
          haptic.medium();
          setCart(prev=>prev.filter(i=>i.id!==id));
        }
      }, []);

      const sendingRef = useRef(false);
      const sendOrder = useCallback(() => {
        if(!cart.length) {
          tg ? tg.showAlert("Корзина пуста. Добавьте товары.") : alert("Корзина пуста.");
          haptic.error(); return;
        }
        if(!name.trim()||!phone.trim()||!address.trim()) {
          tg ? tg.showAlert("Заполните имя, телефон и адрес доставки.") : alert("Заполните все поля.");
          haptic.warning(); return;
        }
        saveClient(name, phone, address);
        haptic.success();
        const lines = [
          "Здравствуйте! Хочу оформить заказ:","",
          `👤 Имя: ${name.trim()}`,
          `📞 Телефон: ${phone.trim()}`,
          `📍 Адрес: ${address.trim()}`, "",
        ];
        cart.forEach((it,i) =>
          lines.push(`${i+1}. ${it.name} — ${wLabel(it.weightType)} — ${it.priceStr} × ${it.quantity} = ${fmt(it.priceValue*it.quantity)}`)
        );
        lines.push("", `ИТОГО: ${fmt(totalPrice)}`);
        // Запасной путь: открыть чат с менеджером с готовым текстом (как раньше)
        const fallback = () => {
          const url = `https://t.me/${TG_USER}?text=${encodeURIComponent(lines.join("\n"))}`;
          tg?.openTelegramLink ? tg.openTelegramLink(url) : window.open(url,"_blank","noopener,noreferrer");
        };
        if(!tg?.initData) { fallback(); return; }
        if(sendingRef.current) return; // защита от двойного нажатия
        sendingRef.current = true;
        const send = () => fetch(ORDER_URL, {
            method: "POST",
            headers: { "Content-Type": "text/plain" },
            body: JSON.stringify({ initData: tg.initData, text: lines.slice(2).join("\n") }),
          })
          .then(r => r.json())
          .then(res => {
            if(!res.ok) throw new Error("order failed");
            tg.showAlert(`Заказ №${res.id} принят! ✅\nПодтверждение пришло в чат с ботом.`, () => tg.close());
          })
          .catch(() => { sendingRef.current = false; fallback(); });
        // Просим разрешение, чтобы бот мог прислать подтверждение и статусы
        if(tg.initDataUnsafe?.user?.allows_write_to_pm || !tg.requestWriteAccess) send();
        else tg.requestWriteAccess(() => send());
      }, [cart, name, phone, address, totalPrice]);

      const cats = useMemo(() => ["Все", ...data.map(b=>b.cat)], []);
      const cartMap = useMemo(() => Object.fromEntries(cart.map(i=>[i.id,i.quantity])), [cart]);

      return (
        <div>
          {/* ═══════════════ КАТАЛОГ ═══════════════ */}
          <div className={"view"+(view==="catalog"?"":" hidden")}>
            <div className="header">
              <div>
                <div className="header-title">ROYAL MARKET</div>
                <div className="header-sub">Прайс-лист · цены за кг / 500 г / 250 г</div>
              </div>
              {!tg && totalQty > 0 && (
                <button className="cart-open-btn" onClick={()=>{haptic.light();setView("cart");}}>
                   {totalQty} · {fmt(totalPrice)}
                </button>
              )}
            </div>

            <div className="chips">
              {cats.map(c => (
                <button key={c} className={"chip"+(cat===c?" active":"")}
                  onClick={()=>{setCat(c);haptic.light();}}>
                  {c}
                </button>
              ))}
            </div>

            {filtered.map(block => (
              <div key={block.cat}>
                <div className="section-label">{block.cat}</div>
                <div className="section-cards">
                  {block.items.map((item,idx) => {
                    const anyInCart = ['kg','g500','g250','pack'].some(wt => item[wt] && cartMap[`${item.name}-${wt}`]);
                    return (
                    <div key={idx} className={"product-row"+(anyInCart?" in-cart":"")}>
                      <div className="product-name">{item.name}</div>
                      {item.note && <div className="product-note">{item.note}</div>}
                      <div className="price-pills">
                        {item.kg   && <PricePill item={item} weightType="kg"   priceStr={item.kg}   onAdd={addToCart} qty={cartMap[`${item.name}-kg`]||0}/>}
                        {item.g500 && <PricePill item={item} weightType="g500" priceStr={item.g500} onAdd={addToCart} qty={cartMap[`${item.name}-g500`]||0}/>}
                        {item.g250 && <PricePill item={item} weightType="g250" priceStr={item.g250} onAdd={addToCart} qty={cartMap[`${item.name}-g250`]||0}/>}
                        {item.pack && <PricePill item={item} weightType="pack" priceStr={item.pack} onAdd={addToCart} qty={cartMap[`${item.name}-pack`]||0}/>}
                      </div>
                    </div>
                    );
                  })}
                </div>
              </div>
            ))}
            <div className="spacer"/>
          </div>

          {/* ═══════════════ КОРЗИНА ═══════════════ */}
          <div className={"view"+(view==="cart"?"":" hidden")}>
            <div className="header">
              <div>
                <div className="header-title">Корзина</div>
                <div className="header-sub">{totalQty} поз. · {fmt(totalPrice)}</div>
              </div>
              {!tg && (
                <button className="cart-open-btn"
                  style={{background:"transparent",color:"var(--link)",fontWeight:400}}
                  onClick={()=>{haptic.light();setView("catalog");}}>
                  ← Назад
                </button>
              )}
            </div>

            {cart.length === 0 ? (
              <div className="empty">
                <div className="empty-icon">🛒</div>
                <div className="empty-title">Корзина пуста</div>
                <div className="empty-sub">Добавьте товары из каталога</div>
              </div>
            ) : (<>
              <div className="section-label">Данные для доставки</div>
              <div className="form-block">
                <div className="form-row">
                  <span className="form-lbl">Имя</span>
                  <input className="form-inp" value={name}
                    onChange={e=>setName(e.target.value)}
                    placeholder="Ваше имя" autoComplete="name"/>
                </div>
                <div className="form-row">
                  <span className="form-lbl">Телефон</span>
                  <input className="form-inp" value={phone}
                    onChange={e=>setPhone(e.target.value)}
                    placeholder="+375 29 000-00-00"
                    type="tel" inputMode="tel" autoComplete="tel"/>
                </div>
                <div className="form-row">
                  <span className="form-lbl">Адрес</span>
                  <input className="form-inp" value={address}
                    onChange={e=>setAddress(e.target.value)}
                    placeholder="Улица, дом, квартира"
                    autoComplete="street-address"/>
                </div>
              </div>

              <div className="section-label">Товары</div>
              <div className="cart-items">
                {cart.map(it => (
                  <div key={it.id} className="cart-item">
                    <div className="ci-top">
                      <div>
                        <div className="ci-name">{it.name}</div>
                        <div className="ci-weight">{wLabel(it.weightType)}</div>
                      </div>
                      <div>
                        <div className="ci-price">{fmt(it.priceValue*it.quantity)}</div>
                        <div className="ci-sub">{fmt(it.priceValue)} × {it.quantity}</div>
                      </div>
                    </div>
                    <div className="ci-bottom">
                      <div className="qty">
                        <button className="qty-btn" onClick={()=>updateQty(it.id,it.quantity-1)}>−</button>
                        <span className="qty-num">{it.quantity}</span>
                        <button className="qty-btn" onClick={()=>updateQty(it.id,it.quantity+1)}>+</button>
                      </div>
                      <button className="del-btn" onClick={()=>removeItem(it.id)}>Удалить</button>
                    </div>
                  </div>
                ))}
              </div>

              <div className="footer-info">
                Товары можно забрать по адресу: ул. Торговая, 15<br/>
                Режим работы: Пн–Вс 9:00–21:00
              </div>

              {!tg && (
                <div className="browser-btns">
                  <button className="b-btn b-btn-primary" onClick={sendOrder}>Отправить заказ</button>
                  <button className="b-btn b-btn-secondary" onClick={()=>{haptic.medium();setCart([]);}}>🗑️ Очистить корзину</button>
                </div>
              )}
            </>)}
            <div className="spacer"/>
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
  </script>
</body>
</html>
